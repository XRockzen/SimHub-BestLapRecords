<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="Segoe UI, Arial, sans-serif">
  <title>Schéma : le capitaine crée le dossier d'équipe et le partage en éditeur</title>
  <rect width="900" height="340" rx="14" fill="#F4F5F7"/>
  <text x="28" y="40" font-size="18" font-weight="600" fill="#1F2328">Le capitaine crée le dossier d'équipe et le partage (sur drive.google.com)</text>

  <!-- Folder + context menu -->
  <rect x="28" y="64" width="330" height="250" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="46" y="92" font-size="13" fill="#57606A">Mon Drive</text>
  <rect x="46" y="106" width="200" height="36" rx="8" fill="#DDF4FF" stroke="#FF453A" stroke-width="2.5"/>
  <text x="60" y="130" font-size="14" font-weight="600" fill="#1F2328">📁  LMU Équipe</text>
  <rect x="150" y="150" width="190" height="146" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
  <g font-size="14" fill="#1F2328">
    <text x="168" y="176">Télécharger</text>
    <text x="168" y="204">Renommer</text>
    <rect x="156" y="216" width="178" height="30" rx="6" fill="#FFF1F0" stroke="#FF453A" stroke-width="2.5"/>
    <text x="168" y="236" font-weight="600">Partager  ›  Partager</text>
    <text x="168" y="270">Organiser</text>
  </g>
  <text x="46" y="170" font-size="12" fill="#57606A">clic droit</text>
  <text x="46" y="186" font-size="12" fill="#57606A">sur le dossier</text>

  <path d="M372 190 L410 190" stroke="#8C959F" stroke-width="2" fill="none"/>
  <path d="M404 184 L412 190 L404 196" stroke="#8C959F" stroke-width="2" fill="none"/>

  <!-- Share dialog -->
  <rect x="424" y="64" width="448" height="250" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="444" y="96" font-size="16" font-weight="600" fill="#1F2328">Partager « LMU Équipe »</text>
  <rect x="444" y="114" width="300" height="38" rx="6" fill="#FFFFFF" stroke="#FF453A" stroke-width="2.5"/>
  <text x="458" y="138" font-size="14" fill="#57606A">email du coéquipier</text>
  <rect x="756" y="114" width="98" height="38" rx="6" fill="#FFF1F0" stroke="#FF453A" stroke-width="2.5"/>
  <text x="770" y="138" font-size="14" font-weight="600" fill="#1F2328">Éditeur ▾</text>
  <text x="444" y="186" font-size="13" fill="#57606A">Une personne par adresse ; ajoutez autant de coéquipiers que voulu.</text>
  <text x="444" y="206" font-size="13" fill="#57606A">« Éditeur » est indispensable : chacun dépose son propre fichier.</text>
  <rect x="764" y="256" width="90" height="38" rx="19" fill="#0B57D0" stroke="#FF453A" stroke-width="2.5"/>
  <text x="786" y="280" font-size="14" font-weight="600" fill="#FFFFFF">Envoyer</text>

  <g font-size="13" font-weight="700" fill="#FFFFFF">
    <circle cx="46" cy="106" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="41.5" y="111">1</text>
    <circle cx="156" cy="216" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="151.5" y="221">2</text>
    <circle cx="444" cy="114" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="439.5" y="119">3</text>
    <circle cx="854" cy="114" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="849.5" y="119">4</text>
    <circle cx="764" cy="256" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="759.5" y="261">5</text>
  </g>
</svg>
