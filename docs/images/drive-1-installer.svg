<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Segoe UI, Arial, sans-serif">
  <title>Schéma : Google Drive pour ordinateur ajoute un lecteur dans l'Explorateur Windows</title>
  <rect width="900" height="330" rx="14" fill="#F4F5F7"/>
  <text x="28" y="40" font-size="18" font-weight="600" fill="#1F2328">Après installation et connexion, Google Drive devient un lecteur Windows</text>

  <!-- Step boxes -->
  <g font-size="14" fill="#1F2328">
    <rect x="28" y="66" width="250" height="74" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
    <text x="48" y="96" font-weight="600">Télécharger</text>
    <text x="48" y="120" fill="#57606A">google.com/drive/download</text>
    <rect x="28" y="152" width="250" height="74" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
    <text x="48" y="182" font-weight="600">Installer, puis se connecter</text>
    <text x="48" y="206" fill="#57606A">avec son compte Google</text>
    <rect x="28" y="238" width="250" height="74" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
    <text x="48" y="268" font-weight="600">Ouvrir l'Explorateur</text>
    <text x="48" y="292" fill="#57606A">touches Windows + E</text>
  </g>
  <g font-size="13" font-weight="700" fill="#FFFFFF">
    <circle cx="28" cy="66" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="23.5" y="71">1</text>
    <circle cx="28" cy="152" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="23.5" y="157">2</text>
    <circle cx="28" cy="238" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="23.5" y="243">3</text>
  </g>

  <path d="M292 275 L330 275" stroke="#8C959F" stroke-width="2" fill="none"/>
  <path d="M324 269 L332 275 L324 281" stroke="#8C959F" stroke-width="2" fill="none"/>

  <!-- Explorer mock -->
  <rect x="344" y="66" width="528" height="246" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
  <rect x="344" y="66" width="528" height="34" rx="10" fill="#E9ECEF"/>
  <rect x="344" y="90" width="528" height="10" fill="#E9ECEF"/>
  <text x="362" y="88" font-size="13" fill="#57606A">Explorateur de fichiers</text>
  <g font-size="14" fill="#1F2328">
    <text x="366" y="132">🖥  Ce PC</text>
    <text x="390" y="162">💽  Disque local (C:)</text>
    <rect x="378" y="174" width="300" height="30" rx="6" fill="#DDF4FF" stroke="#FF453A" stroke-width="2.5"/>
    <text x="390" y="195" font-weight="600">☁  Google Drive (G:)</text>
    <text x="414" y="228">📁  Mon Drive</text>
    <text x="438" y="258" fill="#57606A">📁  … vos dossiers Drive</text>
  </g>
  <circle cx="690" cy="189" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/>
  <text x="685.5" y="194" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
  <text x="712" y="186" font-size="13" fill="#1F2328">La lettre peut varier</text>
  <text x="712" y="204" font-size="13" fill="#1F2328">(G:, H:, I:…)</text>
</svg>
