<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Segoe UI, Arial, sans-serif">
  <title>Schéma : sélection du dossier d'équipe dans la fenêtre « Choisir… » du plugin</title>
  <rect width="900" height="330" rx="14" fill="#F4F5F7"/>
  <text x="28" y="40" font-size="18" font-weight="600" fill="#1F2328">Dans TeamPace : « Choisir… » puis sélectionner le dossier d'équipe</text>

  <rect x="170" y="62" width="560" height="252" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
  <rect x="170" y="62" width="560" height="34" rx="10" fill="#E9ECEF"/>
  <rect x="170" y="86" width="560" height="10" fill="#E9ECEF"/>
  <text x="188" y="84" font-size="13" fill="#57606A">Rechercher un dossier</text>
  <text x="188" y="120" font-size="13" fill="#1F2328">Dossier Google Drive partagé avec l'équipe</text>

  <rect x="188" y="132" width="524" height="128" rx="6" fill="#FFFFFF" stroke="#D0D7DE"/>
  <g font-size="14" fill="#1F2328">
    <text x="204" y="156">🖥  Ce PC</text>
    <text x="228" y="180">☁  Google Drive (G:)</text>
    <text x="252" y="204">📁  Mon Drive</text>
    <rect x="268" y="214" width="190" height="30" rx="5" fill="#DDF4FF" stroke="#FF453A" stroke-width="2.5"/>
    <text x="276" y="235" font-weight="600">📁  LMU Équipe</text>
  </g>
  <text x="476" y="234" font-size="12" fill="#57606A">(le raccourci ajouté à l'étape précédente)</text>

  <rect x="532" y="272" width="84" height="30" rx="5" fill="#E9ECEF" stroke="#FF453A" stroke-width="2.5"/>
  <text x="564" y="292" font-size="14" font-weight="600" fill="#1F2328">OK</text>
  <rect x="628" y="272" width="84" height="30" rx="5" fill="#E9ECEF" stroke="#D0D7DE"/>
  <text x="648" y="292" font-size="14" fill="#1F2328">Annuler</text>

  <g font-size="13" font-weight="700" fill="#FFFFFF">
    <circle cx="268" cy="214" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="263.5" y="219">1</text>
    <circle cx="532" cy="272" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="527.5" y="277">2</text>
  </g>
</svg>
