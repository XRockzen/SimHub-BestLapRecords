<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Segoe UI, Arial, sans-serif">
  <title>Schéma : chaque coéquipier ajoute un raccourci du dossier partagé dans son Drive</title>
  <rect width="900" height="330" rx="14" fill="#F4F5F7"/>
  <text x="28" y="40" font-size="18" font-weight="600" fill="#1F2328">Chaque coéquipier ajoute le dossier à son Drive (sur drive.google.com)</text>

  <!-- Sidebar -->
  <rect x="28" y="64" width="200" height="240" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
  <g font-size="14" fill="#1F2328">
    <text x="46" y="98">🏠  Accueil</text>
    <text x="46" y="130">📁  Mon Drive</text>
    <rect x="38" y="146" width="180" height="32" rx="6" fill="#DDF4FF" stroke="#FF453A" stroke-width="2.5"/>
    <text x="46" y="168" font-weight="600">👥  Partagés avec moi</text>
    <text x="46" y="206">🕘  Récents</text>
  </g>

  <!-- List + menus -->
  <rect x="244" y="64" width="628" height="240" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
  <rect x="262" y="84" width="220" height="36" rx="8" fill="#DDF4FF" stroke="#FF453A" stroke-width="2.5"/>
  <text x="276" y="108" font-size="14" font-weight="600" fill="#1F2328">📁  LMU Équipe</text>
  <text x="262" y="144" font-size="12" fill="#57606A">clic droit sur le dossier</text>
  <rect x="380" y="128" width="200" height="120" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
  <g font-size="14" fill="#1F2328">
    <text x="398" y="156">Ouvrir avec</text>
    <text x="398" y="184">Partager</text>
    <rect x="386" y="198" width="188" height="30" rx="6" fill="#FFF1F0" stroke="#FF453A" stroke-width="2.5"/>
    <text x="398" y="218" font-weight="600">Organiser  ›</text>
  </g>
  <rect x="590" y="190" width="264" height="96" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
  <g font-size="14" fill="#1F2328">
    <text x="608" y="218">Déplacer</text>
    <rect x="596" y="232" width="252" height="30" rx="6" fill="#FFF1F0" stroke="#FF453A" stroke-width="2.5"/>
    <text x="608" y="252" font-weight="600">Ajouter un raccourci</text>
  </g>
  <text x="608" y="280" font-size="12" fill="#57606A">puis choisir « Mon Drive » et valider</text>

  <g font-size="13" font-weight="700" fill="#FFFFFF">
    <circle cx="38" cy="146" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="33.5" y="151">1</text>
    <circle cx="262" cy="84" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="257.5" y="89">2</text>
    <circle cx="386" cy="198" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="381.5" y="203">3</text>
    <circle cx="596" cy="232" r="13" fill="#FF453A" stroke="#FFFFFF" stroke-width="2"/><text x="591.5" y="237">4</text>
  </g>
</svg>
